name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: pure-Python tests (grader, judge, protocol, notation, document writer)
        run: python -m pytest validation/test_grader.py validation/test_grader_v2.py validation/test_protocol.py validation/test_notation.py validation/test_docs_llm.py -q
