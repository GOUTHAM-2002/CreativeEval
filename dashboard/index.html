<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>eval_imp runs</title>
<style>
:root{--bg:#f9f9f7;--surface:#fcfcfb;--surface2:#f1f1ee;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--border:rgba(11,11,11,.10);
 --blue:#2a78d6;--good:#0ca30c;--warn:#c98500;--crit:#d03b3b;--violet:#4a3aa7;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d0d0d;--surface:#1a1a19;--surface2:#232321;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.10);--blue:#3987e5}}
:root[data-theme=dark]{--bg:#0d0d0d;--surface:#1a1a19;--surface2:#232321;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;--border:rgba(255,255,255,.10);--blue:#3987e5}
*{box-sizing:border-box}body{margin:0;font:13px system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
header h1{font-size:14px;margin:0}header .sub{color:var(--muted);font-size:12px}.spacer{flex:1}
select,button{font:inherit;border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 8px}
.wrap{display:grid;grid-template-columns:minmax(360px,44%) 1fr;height:calc(100vh - 42px)}
.grid{overflow:auto;padding:10px;border-right:1px solid var(--border)}
table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--border);padding:4px 6px;text-align:left;vertical-align:top;font-size:12px}
th{background:var(--surface2);position:sticky;top:0}td.cell{cursor:pointer;min-width:120px}td.cell:hover{background:var(--surface2)}td.sel{outline:2px solid var(--blue);outline-offset:-2px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:600}
.pending{background:var(--surface2);color:var(--muted)}.running{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}.stale{background:color-mix(in srgb,var(--warn) 26%,transparent);color:var(--warn)}
.bad{color:var(--crit);font-weight:600}.small{color:var(--muted);font-size:11px}
.detail{overflow:auto;padding:14px 18px}.empty{color:var(--muted);text-align:center;margin-top:80px}
.tabs{display:flex;gap:6px;margin:8px 0}.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.kv{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink2);margin-bottom:8px}.kv b{color:var(--ink)}
.msg{border-left:3px solid var(--border);padding:2px 0 2px 10px;margin-bottom:8px}.msg.assistant{border-color:var(--blue)}.msg.tool{border-color:var(--muted)}.msg.user{border-color:var(--good)}
.role{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.text{white-space:pre-wrap;margin:3px 0}
.call,.res,pre{font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 8px;white-space:pre-wrap;overflow-x:auto;margin:3px 0}
.res{color:var(--ink2);max-height:220px;overflow:auto}.fn{color:var(--violet);font-weight:700}
.diff .add{color:var(--good)}.diff .del{color:var(--crit)}.diff .hdr{color:var(--muted)}
details summary{cursor:pointer;color:var(--blue)}
@media (max-width:900px){.wrap{grid-template-columns:1fr;height:auto}.grid{border-right:0}}
</style></head><body>
<header><h1>eval_imp</h1><span class="sub">runs/&lt;tag&gt;/&lt;model&gt;/&lt;instance&gt; — read-only</span>
<label>tag <select id="tag"></select></label><span id="ledger" class="small"></span><span class="spacer"></span>
<span id="clock" class="small"></span><button id="refresh">refresh</button></header>
<div class="wrap"><div class="grid" id="grid"></div><div class="detail" id="detail"><div class="empty">select a cell</div></div></div>
<script>
const $=s=>document.querySelector(s);let TAG=null,SEL=null,CELLS=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function j(u){const r=await fetch(u);return r.json()}
async function loadTags(){const d=await j('/api/tags');const sel=$('#tag');const cur=sel.value;sel.innerHTML='';
 for(const t of d.tags){const o=document.createElement('option');o.value=t.name;o.textContent=`${t.name} (${t.n_cells})`;sel.appendChild(o)}
 if(!TAG&&d.tags.length)TAG=(location.hash.slice(1)||d.tags[d.tags.length-1].name);if(TAG)sel.value=TAG;
 const led=d.tags.find(t=>t.name===TAG)?.ledger;$('#ledger').textContent=led?`ledger: spent $${(+led.spent_usd||0).toFixed(2)} / cap $${led.cap_usd}`:''}
async function loadCells(){if(!TAG)return;const d=await j('/api/cells?tag='+encodeURIComponent(TAG));CELLS=d.cells;render();$('#clock').textContent=new Date().toLocaleTimeString()}
function render(){const models=[...new Set(CELLS.map(c=>c.model))],insts=[...new Set(CELLS.map(c=>c.inst))];
 let h='<table><tr><th>instance</th>'+models.map(m=>`<th>${esc(m)}</th>`).join('')+'</tr>';
 for(const i of insts){h+=`<tr><td>${esc(i)}</td>`;for(const m of models){const c=CELLS.find(x=>x.model===m&&x.inst===i);
  if(!c){h+='<td></td>';continue}const sel=SEL&&SEL.model===m&&SEL.inst===i?' sel':'';
  h+=`<td class="cell${sel}" data-m="${esc(m)}" data-i="${esc(i)}"><span class="pill ${c.status}">${c.status}</span> `
   +(c.end_reason?`<span class="${['api_error','harness_error'].includes(c.end_reason)?'bad':''}">${esc(c.end_reason)}</span>`:'')
   +`<div class="small">calls ${c.n_tool_calls??'-'} · snaps ${c.n_snapshots} · $${c.cost_usd!=null?(+c.cost_usd).toFixed(2):'-'}`
   +(c.aggregate!=null?` · agg ${(+c.aggregate).toFixed(3)}`:'')+(c.invalid?` · <span class="bad">invalid ${c.invalid}</span>`:'')
   +(c.status==='running'&&c.age_s!=null?` · ${c.age_s}s ago`:'')+`</div></td>`}h+='</tr>'}
 $('#grid').innerHTML=h+'</table>';document.querySelectorAll('td.cell').forEach(td=>td.onclick=()=>open(td.dataset.m,td.dataset.i))}
let TAB='transcript';
async function open(m,i){SEL={model:m,inst:i};render();const d=await j(`/api/cell?tag=${encodeURIComponent(TAG)}&model=${encodeURIComponent(m)}&inst=${encodeURIComponent(i)}`);showDetail(d)}
function showDetail(d){const e=d.episode||{},s=d.summary||{};
 const kv=[['status',s.status],['end',e.end_reason],['detail',e.end_detail],['route',e.route],['model seen',e.model_id_observed],['tier',e.tier],['tool calls',e.n_tool_calls],['validate',e.n_validate_calls],['wall s',e.wall_s],['cost $',e.cost_usd],['cost src',e.cost_source],['max ctx',d.usage?.max_context],['out tok',d.usage?.output_tokens],['answer',e.answer_present],['invalid',JSON.stringify(e.invalid_markers||[])]];
 let h=`<h2 style="margin:0 0 6px;font-size:14px">${esc(s.model)} / ${esc(s.inst)}</h2><div class="kv">`+kv.map(([k,v])=>`<span>${k}: <b>${esc(v??'-')}</b></span>`).join('')+'</div>';
 const tabs=['transcript','tool_log','answer_history','score','episode'];h+='<div class="tabs">'+tabs.map(t=>`<button data-t="${t}" class="${TAB===t?'on':''}">${t.replace('_',' ')}</button>`).join('')+'</div><div id="tab"></div>';
 $('#detail').innerHTML=h;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;showDetail(d)});
 const t=$('#tab');
 if(TAB==='transcript')t.innerHTML=(d.transcript||[]).map(r=>{if(r.role==='tool')return`<div class="msg tool"><div class="role">tool result · ${esc(r.name)}${r.is_error?' · <span class="bad">error</span>':''}</div><div class="res">${esc(r.result_preview)}</div></div>`;
   const calls=(r.tool_calls||[]).map(c=>`<div class="call"><span class="fn">${esc(c.name)}</span> ${esc(JSON.stringify(c.args||c.input||{}))}</div>`).join('');
   return`<div class="msg ${r.role}"><div class="role">${r.role} #${r.i}${r.context_tokens?` · ctx ${r.context_tokens}`:''}${r.nudge?' · nudge':''}</div>${r.reasoning?`<details><summary>reasoning</summary><div class="text small">${esc(r.reasoning)}</div></details>`:''}<div class="text">${esc(r.text)}</div>${calls}</div>`}).join('')||'<div class="empty">no transcript</div>';
 else if(TAB==='tool_log')t.innerHTML='<table><tr><th>seq</th><th>tool</th><th>args</th><th>exit</th><th>out</th><th>ms</th></tr>'+(d.tool_log||[]).map(r=>`<tr><td>${r.seq}</td><td>${esc(r.tool)}</td><td><pre style="margin:0;max-height:120px;overflow:auto">${esc(JSON.stringify(r.args))}</pre></td><td>${esc(r.exit)}</td><td>${r.stdout_len}/${r.stderr_len}</td><td>${r.ms}</td></tr>`).join('')+'</table>';
 else if(TAB==='answer_history')t.innerHTML=(d.snapshots||[]).map(sn=>`<details ${sn===d.snapshots[d.snapshots.length-1]?'open':''}><summary>${sn.name} · ${sn.bytes} B · ${sn.n_lines} lines · ${sn.valid_json?'valid JSON':'<span class="bad">invalid JSON</span>'}</summary><pre class="diff">${sn.diff.split('\n').map(l=>`<span class="${l.startsWith('+')?'add':l.startsWith('-')?'del':l.startsWith('@')?'hdr':''}">${esc(l)}</span>`).join('\n')}</pre></details>`).join('')||'<div class="empty">no snapshots</div>';
 else if(TAB==='score')t.innerHTML=d.score?`<pre>${esc(JSON.stringify(d.score,null,1))}</pre>`:'<div class="empty">no score.json</div>';
 else t.innerHTML=`<pre>${esc(JSON.stringify(d.episode,null,1))}</pre>`+(d.selftest?`<h4>selftest</h4><pre>${esc(d.selftest)}</pre>`:'')}
$('#tag').onchange=e=>{TAG=e.target.value;location.hash=TAG;SEL=null;$('#detail').innerHTML='<div class="empty">select a cell</div>';loadTags();loadCells()};
$('#refresh').onclick=()=>{loadTags();loadCells();if(SEL)open(SEL.model,SEL.inst)};
loadTags().then(loadCells);setInterval(loadCells,10000);
</script></body></html>
